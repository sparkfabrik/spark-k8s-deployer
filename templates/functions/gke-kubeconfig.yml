# This template generates a namespace-scoped kubeconfig for GKE clusters.
# It is an alternative to the GitLab Agent approach and can work with any
# gcloud authentication method (WIF, service account key, etc.).
# It requires gcloud to be already authenticated before this template runs.
#
# Example:
# include:
#   - remote: "https://raw.githubusercontent.com/sparkfabrik/spark-k8s-deployer/master/templates/functions/gitlab-helper-functions.yml"
#   - remote: "https://raw.githubusercontent.com/sparkfabrik/spark-k8s-deployer/master/templates/functions/gke-kubeconfig.yml"
# test_job:
#   stage: test
#   before_script:
#     - !reference [.gitlab-helper-functions, before_script]
#     - !reference [.gke-kubeconfig, before_script]
#   script:
#     - kubectl get pods

.gke-kubeconfig:
  before_script:
    # Functions
    - |
      check_gcloud_auth() {
        if ! command -v gcloud &> /dev/null; then
          echo "The gcloud command is not available. Cannot generate GKE kubeconfig."
          return 1
        fi

        local active_account
        active_account=$(gcloud auth list --filter="status=ACTIVE" --format="value(account)" 2>/dev/null)
        if [ -z "${active_account}" ]; then
          echo "No active gcloud authenticated account found. Cannot generate GKE kubeconfig."
          echo "Authenticate gcloud before using this template (e.g. via gcp-wif.yml)."
          return 1
        fi

        echo "Active gcloud account: ${active_account}"
        return 0
      }

      check_gke_env() {
        local missing=0

        if [ -z "${K8S_CLUSTER_NAME:-}" ]; then
          echo "Missing K8S_CLUSTER_NAME."
          missing=1
        fi

        if [ -z "${K8S_LOCATION:-}" ]; then
          echo "Missing K8S_LOCATION."
          missing=1
        fi

        if [ -z "${GCP_PROJECT_ID:-}" ]; then
          echo "Missing GCP_PROJECT_ID."
          missing=1
        fi

        if [ -z "${KUBE_NAMESPACE:-}" ]; then
          echo "Missing KUBE_NAMESPACE."
          missing=1
        fi

        return "${missing}"
      }

      generate_gke_kubeconfig() {
        local gcloud_cmd=(
          gcloud container clusters get-credentials "${K8S_CLUSTER_NAME}"
          --location "${K8S_LOCATION}"
          --project "${GCP_PROJECT_ID}"
        )

        if [ "${K8S_USE_DNS_ENDPOINT:-0}" = "1" ]; then
          gcloud_cmd+=(--dns-endpoint)
        fi

        "${gcloud_cmd[@]}"

        kubectl config set-context --current --namespace="${KUBE_NAMESPACE}"
      }

    # Main script
    - |
      if command -v section_start &> /dev/null; then
        section_start "gke-kubeconfig" "GKE Kubeconfig"
      fi
      if command -v print-banner &> /dev/null; then
        print-banner "GKE KUBECONFIG"
      fi
      if [ -n "${K8S_CLUSTER_NAME:-}" ]; then
        if check_gcloud_auth; then
          if check_gke_env; then
            if generate_gke_kubeconfig; then
              echo "GKE kubeconfig generated and scoped to namespace ${KUBE_NAMESPACE}."
            else
              echo "GKE kubeconfig generation failed."
              exit 1
            fi
          else
            echo "GKE kubeconfig generation skipped due to missing variables."
            exit 1
          fi
        else
          echo "GKE kubeconfig generation skipped due to missing gcloud authentication."
          exit 1
        fi
      else
        echo "GKE kubeconfig generation skipped (K8S_CLUSTER_NAME not set)."
      fi
      if command -v print-banner &> /dev/null; then
        print-banner "END GKE KUBECONFIG"
      fi
      if command -v section_end &> /dev/null; then
        section_end "gke-kubeconfig"
      fi
