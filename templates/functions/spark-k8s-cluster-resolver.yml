# Resolve at runtime which cluster owns the current git ref, so a consumer project
# declares no cluster identity in its pipeline. The routing document arrives as the
# File type CI/CD variable $SPARK_K8S_CONFIG and carries one of two shapes.
#
# The environment shape, one entry per environment:
#
#   envs:
#     - env: prod
#       namespace: example-prod
#       name: example-prod
#       project_id: example-prod-project
#       location: europe-west1
#       refs: [main, "refs/tags/v*"]
#       dns_endpoint: gke-....gke.goog
#       use_dns_endpoint: true
#     - env: dev
#       namespace: example-dev
#       name: example-dev
#       project_id: example-dev-project
#       location: europe-west1
#       refs: ["**"]
#
# Every pattern of every environment is tried and the most specific match wins, never
# the list order: a literal beats a glob, a glob beats a regex, and between globs more
# literal characters win, then fewer ** and then fewer *. There is no default entry: a
# catch-all is the explicit "**", which matches branches only, `refs: []` never matches,
# and a ref no environment claims resolves nothing and the job skips. Two environments
# matching at equal rank fail the job. On a match KUBE_NAMESPACE is exported too.
#
# The cluster shape, one entry per cluster, is what projects received before
# environments existed and keeps its behaviour:
#
#   clusters:
#     - name: example-dev
#       project_id: example-dev-project
#       location: europe-west1
#       default: true
#       refs: []
#       dns_endpoint: gke-....gke.goog
#     - name: example-prod
#       project_id: example-prod-project
#       location: europe-west1
#       default: false
#       refs: [main]
#       dns_endpoint: gke-....gke.goog
#       use_dns_endpoint: true
#
# The list is scanned bottom-up, last declared match wins, no match uses the default
# entry, and KUBE_NAMESPACE stays a project variable.
#
# On a match K8S_CLUSTER_NAME, GCP_PROJECT_ID, K8S_LOCATION and K8S_USE_DNS_ENDPOINT
# are exported for .gke-kubeconfig, plus DISABLE_GITLAB_AGENT=1, so this must run
# BEFORE setup-gitlab-agent. KUBE_NAMESPACE is never unset before resolving: the shape
# is unknown until the resolver has run, and on every skip path it is the project
# variable a job still needs.
# Unset $SPARK_K8S_CONFIG or a job image without the deployer scripts: skipped, no failure,
# and the single-value K8S_* variables injected by the project are left untouched.
# Written for POSIX sh and without an EXIT trap (.gcp-wif relies on its own).
#
# Example:
# include:
#   - remote: "https://raw.githubusercontent.com/sparkfabrik/spark-k8s-deployer/master/templates/functions/gitlab-helper-functions.yml"
#   - remote: "https://raw.githubusercontent.com/sparkfabrik/spark-k8s-deployer/master/templates/functions/spark-k8s-cluster-resolver.yml"
#   - remote: "https://raw.githubusercontent.com/sparkfabrik/spark-k8s-deployer/master/templates/functions/gke-kubeconfig.yml"
# deploy_job:
#   stage: deploy
#   before_script:
#     - !reference [.gitlab-helper-functions, before_script]
#     - !reference [.spark-k8s-cluster-resolver, before_script]
#     - !reference [.gke-kubeconfig, before_script]
#   script:
#     # Skip when no cluster owns this ref (merge request pipelines). Job script only.
#     - !reference [.spark-k8s-require-cluster, script]
#     - helm upgrade --install ...

.spark-k8s-cluster-resolver:
  before_script:
    - |
      if command -v section_start >/dev/null 2>&1; then
        section_start "spark-k8s-cluster-resolver" "Cluster resolution"
      fi
      if command -v print-banner >/dev/null 2>&1; then
        print-banner "CLUSTER RESOLUTION"
      fi
      SPARK_K8S_CLUSTER_RESOLVED=0
      export SPARK_K8S_CLUSTER_RESOLVED
      # Every skip path leaves K8S_CLUSTER_NAME, GCP_PROJECT_ID, K8S_LOCATION and
      # K8S_USE_DNS_ENDPOINT untouched: a job that cannot resolve keeps deploying to the
      # single-value cluster those variables describe.
      if [ -z "${SPARK_K8S_CONFIG:-}" ]; then
        echo "Cluster resolution skipped (SPARK_K8S_CONFIG not set)."
      elif [ ! -x "/scripts/resolve-cluster" ]; then
        echo "Cluster resolution skipped: /scripts/resolve-cluster is not available in this job image."
      elif ! command -v bash >/dev/null 2>&1; then
        echo "Cluster resolution skipped: bash is not available in this job image."
      elif ! command -v yq4 >/dev/null 2>&1; then
        echo "Cluster resolution skipped: yq4 is not available in this job image."
      else
        # The resolver owns these from now on: a ref that resolves to no cluster must not
        # leave stale values for .gke-kubeconfig.
        unset K8S_CLUSTER_NAME GCP_PROJECT_ID K8S_LOCATION \
          K8S_USE_DNS_ENDPOINT SPARK_K8S_CLUSTER_DNS_ENDPOINT
        # Restore errexit only if it was on, so the rest of the shared chain is unaffected.
        case $- in *e*) SPARK_K8S_HAD_ERREXIT=1 ;; *) SPARK_K8S_HAD_ERREXIT=0 ;; esac
        set +e
        SPARK_K8S_RESOLVER_OUTPUT="$(/scripts/resolve-cluster)"
        SPARK_K8S_RESOLVER_RC=$?
        if [ "${SPARK_K8S_HAD_ERREXIT}" = "1" ]; then
          set -e
        fi
        if [ "${SPARK_K8S_RESOLVER_RC}" = "0" ]; then
          eval "${SPARK_K8S_RESOLVER_OUTPUT}"
          SPARK_K8S_CLUSTER_RESOLVED=1
          # The environment shape exports KUBE_NAMESPACE and the resolver has already
          # logged the environment it resolved, the name of which is not exported.
          if ! printf '%s\n' "${SPARK_K8S_RESOLVER_OUTPUT}" | grep -q '^export KUBE_NAMESPACE='; then
            # printf, not echo: dash and busybox echo expand backslash escapes.
            printf 'Resolved cluster: %s (project %s, location %s).\n' \
              "${K8S_CLUSTER_NAME}" "${GCP_PROJECT_ID}" "${K8S_LOCATION}"
          fi
        elif [ "${SPARK_K8S_RESOLVER_RC}" = "3" ]; then
          echo "No cluster owns the current ref, the cluster dependent steps will be skipped."
        else
          echo "Cluster resolution failed."
          exit 1
        fi
        unset SPARK_K8S_RESOLVER_OUTPUT SPARK_K8S_RESOLVER_RC SPARK_K8S_HAD_ERREXIT
      fi
      if command -v print-banner >/dev/null 2>&1; then
        print-banner "END CLUSTER RESOLUTION"
      fi
      if command -v section_end >/dev/null 2>&1; then
        section_end "spark-k8s-cluster-resolver"
      fi

# Guard for cluster dependent jobs: exit 0 when the resolver is active but no cluster owns
# the ref (merge request pipelines). Job script only: in a global before_script it would end every job.
.spark-k8s-require-cluster:
  script:
    - |
      if [ -n "${SPARK_K8S_CONFIG:-}" ] && [ "${SPARK_K8S_CLUSTER_RESOLVED:-0}" != "1" ]; then
        echo "No cluster owns the current ref, skipping this job."
        exit 0
      fi
