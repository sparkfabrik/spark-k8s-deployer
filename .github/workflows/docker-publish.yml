name: Docker

on:
  pull_request:
  push:
    branches: master

env:
  RELEASE_BRANCH: master
  REGISTRY: ghcr.io
  IMAGE_NAME: spark-k8s-deployer

permissions:
  contents: read

jobs:
  # Builds the image on a native runner for each platform. Pull requests only
  # build and smoke test it; pushes to the release branch also push it by
  # digest, and the merge job tags the digests as one multi-platform image.
  build:
    runs-on: ${{ matrix.platform.runner }}
    name: build (${{ matrix.platform.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      # We use commit sha here to be as safe as possible with credentials.
      - name: Log in to the Container registry
        if: github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH)
        uses: docker/login-action@1f36f5b7a2d2f7bfd524795fc966e6d88c37baa9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Get the Google Cloud CLI image tag
        id: vars
        run: |
          echo "google_cloud_cli_image_tag=$(make print-google-cloud-cli-image-tag)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: github.ref != format('refs/heads/{0}', env.RELEASE_BRANCH)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          load: true
          push: false
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            GOOGLE_CLOUD_CLI_IMAGE_TAG=${{ steps.vars.outputs.google_cloud_cli_image_tag }}
          tags: spark-k8s-deployer:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.arch }}

      - name: Smoke test the downloaded binaries
        if: github.ref != format('refs/heads/{0}', env.RELEASE_BRANCH)
        run: |
          docker run --rm --entrypoint "" spark-k8s-deployer:test sh -ec '
            [ "$(uname -m)" = "${{ matrix.platform.arch == 'amd64' && 'x86_64' || 'aarch64' }}" ]
            docker -v
            docker buildx version
            docker-compose version
            helm version --short
            yq4 --version
            flux --version
            stern --version
            just --version
            kubeconform -v
            kubectl version --client
            kube-linter version
            mkcert -version
            aws --version
            gcloud version
          '

      - name: Build and push Docker image by digest
        id: build
        if: github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            GOOGLE_CLOUD_CLI_IMAGE_TAG=${{ steps.vars.outputs.google_cloud_cli_image_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.arch }}

      - name: Export digest
        if: github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH)
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/digests/${{ matrix.platform.arch }}"

      - name: Upload digest
        if: github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  cluster-resolver:
    runs-on: ubuntu-latest
    # No branch condition on purpose: the suite must also run on master pushes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the yq4 version pinned by the image
        run: |
          YQ4_VERSION="$(sed -n 's/^ENV YQ4_VERSION=//p' Dockerfile)"
          YQ4_SHA256="$(sed -n 's/^ENV YQ4_SHA256_AMD64=//p' Dockerfile)"
          echo "Installing yq ${YQ4_VERSION}"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ4_VERSION}/yq_linux_amd64" -o "${RUNNER_TEMP}/yq4"
          echo "${YQ4_SHA256}  ${RUNNER_TEMP}/yq4" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/yq4" /usr/local/bin/yq4
          yq4 --version

      - name: Install the jv version pinned by the image
        run: |
          JV_VERSION="$(sed -n 's/^ENV JV_VERSION=//p' Dockerfile)"
          echo "Installing jv ${JV_VERSION}"
          go install "github.com/santhosh-tekuri/jsonschema/cmd/jv@${JV_VERSION}"
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - name: Lint the cluster resolver scripts
        run: |
          shellcheck -x \
            scripts/resolve-cluster \
            scripts/src/cluster-resolver.bash \
            test/cluster-resolver/run.sh \
            test/cluster-resolver/resolve-with-schema

      # The suite also runs the schema gate against schemas/cluster-config.schema.json.
      - name: Run the cluster resolver test suite
        run: bash test/cluster-resolver/run.sh

  # Tags the per-platform digests of the build job as one multi-platform image.
  # It also runs when a build leg fails, so an arm64 failure does not hold back
  # the amd64 image; the amd64 digest is required. Without the arm64 digest only
  # the commit SHA tag is pushed and latest is left unchanged. Nothing is
  # published when the cluster resolver suite fails, because the image ships
  # the resolver scripts.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, cluster-resolver]
    # Only deploy on the main/master branch
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.cluster-resolver.result == 'success' && contains('["refs/heads/main", "refs/heads/master"]', github.ref) }}
    permissions:
      contents: read
      packages: write
      # Upload the Trivy results to the Security tab.
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # We use commit sha here to be as safe as possible with credentials.
      - name: Log in to the Container registry
        uses: docker/login-action@1f36f5b7a2d2f7bfd524795fc966e6d88c37baa9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for RELEASE_BRANCH branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH) }}
            type=sha,format=long,prefix=

      - name: Create and push the multi-platform image
        id: index
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE_ID="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          if [ ! -f amd64 ]; then
            echo "::error::The amd64 digest is missing, nothing is published."
            exit 1
          fi
          args=()
          partial=false
          for arch in amd64 arm64; do
            if [ -f "${arch}" ]; then
              args+=("${IMAGE_ID}@$(cat "${arch}")")
            else
              partial=true
              echo "::warning::The ${arch} digest is missing, the image is published without it and latest is left unchanged."
            fi
          done
          # A partial image gets only the commit SHA tag, so latest keeps
          # serving every platform.
          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          for tag in "${tags[@]}"; do
            if [ "${partial}" = true ] && [ "${tag}" = "${IMAGE_ID}:latest" ]; then
              continue
            fi
            args=(-t "${tag}" "${args[@]}")
          done
          docker buildx imagetools create "${args[@]}"
          for arch in amd64 arm64; do
            if [ -f "${arch}" ]; then
              echo "${arch}=$(cat "${arch}")" >> "${GITHUB_OUTPUT}"
            fi
          done

      - name: Inspect the image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Each platform is scanned by its own digest. A digest pushed with its
      # provenance attestation is an index, so TRIVY_PLATFORM picks the image
      # out of it instead of the runner's platform.
      - name: Run Trivy vulnerability scanner (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.amd64 }}
          format: "sarif"
          output: "trivy-results-amd64.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          skip-dirs: "/google-cloud-sdk"

      - name: Upload Trivy scan results to GitHub Security tab (amd64)
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: "trivy-results-amd64.sarif"

      - name: Run Trivy vulnerability scanner (arm64)
        if: steps.index.outputs.arm64 != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.arm64 }}
          format: "sarif"
          output: "trivy-results-arm64.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          skip-dirs: "/google-cloud-sdk"

      # The amd64 upload keeps the default category, so existing alerts carry
      # over; arm64 needs its own category.
      - name: Upload Trivy scan results to GitHub Security tab (arm64)
        if: steps.index.outputs.arm64 != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: "trivy-results-arm64.sarif"
          category: trivy-arm64
