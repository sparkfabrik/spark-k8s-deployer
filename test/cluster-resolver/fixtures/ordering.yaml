clusters:
  - name: fallback
    project_id: spark-fallback-project
    location: europe-west1
    default: true
    refs: []
  - name: first-match
    project_id: spark-first-project
    location: europe-west1
    default: false
    refs: [main]
  - name: catch-all
    project_id: spark-catch-all-project
    location: europe-west1
    default: false
    refs: ["*"]
  - name: last-match
    project_id: spark-last-project
    location: europe-west1
    default: false
    refs: [main]
