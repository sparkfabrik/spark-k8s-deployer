clusters:
  - name: fallback
    project_id: spark-fallback-project
    location: europe-west1
    default: true
    refs: []
  - name: releases
    project_id: spark-releases-project
    location: europe-west1
    default: false
    refs: ['/^release-\d+$/']
  - name: version-tags
    project_id: spark-version-tags-proj
    location: europe-west1
    default: false
    refs: ['/^refs\/tags\/v\d+$/']
