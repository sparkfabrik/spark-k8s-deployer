clusters:
  - name: fallback
    project_id: spark-fallback-project
    location: europe-west1
    default: true
    refs: []
  - name: double-star
    project_id: spark-double-project
    location: europe-west1
    default: false
    refs: ["feature/**"]
  - name: single-star
    project_id: spark-single-project
    location: europe-west1
    default: false
    refs: ["feature/*"]
  - name: tags-only
    project_id: spark-tags-project
    location: europe-west1
    default: false
    refs: ["refs/tags/v*"]
